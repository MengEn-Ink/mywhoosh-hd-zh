name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Version ((Get-Content -LiteralPath 'release-version.txt' -Raw -Encoding UTF8).Trim())
      - uses: actions/upload-artifact@v4
        with:
          name: mywhoosh-hd-zh-win-x64
          path: |
            artifacts/build-*/*.zip
            artifacts/build-*/SHA256SUMS.txt
            artifacts/build-*/tests.json
            artifacts/build-*/gui-layout.json
            artifacts/build-*/gui-layout/*.png
          if-no-files-found: error
          retention-days: 14
